name: Fixture review
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
permissions:
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pulls/${{ inputs.pr }}/reviews" \
            -f event=REQUEST_CHANGES -f body="Fixture: changes requested by a non-viewer account."
